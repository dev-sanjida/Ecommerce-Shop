<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kalles — Contact Us</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header id="site-header"></header>

<div class="page-hero"><h1>Contact Us</h1><p>Home / Contact Us</p></div>

<section>
  <div class="container contact-wrap">
    <div>
      <h2 style="margin-bottom:18px">Get in touch</h2>
      <ul class="contact-info">
        <li><b>Address</b>Dhaka, Bangladesh</li>
        <li><b>Phone</b>+880 1234 567 890</li>
        <li><b>Email</b>hello@kalles.com</li>
        <li><b>Hours</b>Sat &ndash; Thu, 10:00 &ndash; 20:00</li>
      </ul>
    </div>
    <form id="contact-form">
      <div class="notice" id="notice">Thanks! Your message was received (demo form &mdash; not sent anywhere).</div>
      <label for="n">Name</label><input id="n" required>
      <label for="e">Email</label><input id="e" type="email" required>
      <label for="m">Message</label><textarea id="m" rows="6" required></textarea>
      <button class="btn" type="submit">Send message</button>
    </form>
  </div>
</section>

<footer id="site-footer" class="site-footer"></footer>
<script src="js/main.js"></script>
</body>
</html>
